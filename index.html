    <script>
      (function () {
        try {
          var saved = localStorage.getItem('water_meter_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

  <body class="bg-[#F3F6FA] dark:bg-[#0B131E] text-slate-900 dark:text-slate-100 antialiased transition-colors duration-200">
